<!doctype html>
<meta charset="utf-8">
<title>Rune browser clocks and native diagnostics boundaries</title>
<style>#host { width:96px; height:48px } canvas { width:100%; height:100% }</style>
<div id="host"><canvas></canvas></div>
<pre id="result">Starting…</pre>
<script type="module">
import { instantiateRuneBrowser, mountRuneBrowser } from '../../Sources/Rune/Resources/Web/rune-web.mjs';
import { WASI, ConsoleStdout, OpenFile, File, PreopenDirectory } from '/__rune/shim/index.js';

const lines = [];
const wasi = new WASI(['diagnostics-probe'], ['RUNE_RELAUNCH_AFTER=42', 'RUNE_HEADLESS_WAIT=10'], [new OpenFile(new File([])),
    ConsoleStdout.lineBuffered(line => lines.push(line)), ConsoleStdout.lineBuffered(console.error), new PreopenDirectory("/presets", [])]);
const wallNs = 1_700_000_000_123_000_000n;
let instance, app, restoreSubmission;
const originalPerformance = Object.getOwnPropertyDescriptor(window, 'performance');
const result = document.querySelector('#result');
function check(condition, message) { if (!condition) throw Error(message); }

function checkFontStruts(api) {
    const contexts = CanvasRenderingContext2D.prototype;
    const measure = contexts.measureText;
    let spaces = 0, nonce = 0, newFace = false;
    // DesktopFaceBoxes measures a single space for the declared font's line box.
    // Change just that face's ascent to distinguish a stale strut from new glyph ink.
    contexts.measureText = function(text) {
        const metrics = measure.call(this, text);
        if (text !== ' ') return metrics;
        spaces++;
        if (!newFace) return metrics;
        return new Proxy(metrics, { get(target, key) {
            const value = Reflect.get(target, key, target);
            return key === 'fontBoundingBoxAscent' ? value + 8 : value;
        } });
    };
    function shape(size, cold) {
        const before = spaces;
        const y = api.rune_probe_strut(size, ++nonce);
        check(Number.isFinite(y), 'Missing secure glyph or cached secure input');
        check(cold ? spaces > before : spaces === before,
              'Unexpected face measurement at size ' + size + ' on shape ' + nonce);
        return y;
    }
    try {
        api.rune_web_fonts_changed();
        const first = shape(16, true);
        check(shape(16, false) === first, 'Warm glyph baseline moved');
        newFace = true;
        api.rune_web_fonts_changed();
        const changed = shape(16, true);
        check(changed !== first && shape(16, false) === changed, 'Stale glyph baseline after font change');
        for (let i = 1; i < 64; i++) shape(16 + i / 4, true);
        shape(16, false);
        shape(32, true);
        shape(32, false);
        shape(16, true);
        return { shapes: nonce, spaces, firstGlyphY: first, changedGlyphY: changed };
    } finally {
        contexts.measureText = measure;
        api.rune_web_fonts_changed();
    }
}

try {
    const imports = { ...wasi.wasiImport, clock_time_get(id, precision, address) {
        if (id !== 0) return wasi.wasiImport.clock_time_get(id, precision, address);
        new DataView(instance.exports.memory.buffer).setBigUint64(address, wallNs, true);
        return 0;
    } };
    ({ instance } = await instantiateRuneBrowser(fetch('/__rune/diagnostics.wasm'),
        { wasi_snapshot_preview1: imports }, { fontDirectory: null }));
    wasi.initialize(instance);
    const api = instance.exports;
    const host = document.querySelector('#host');
    const canvas = host.querySelector('canvas');
    const context = new OffscreenCanvas(1, 1).getContext('2d');
    let pixel;
    const submit = GPUQueue.prototype.submit;
    GPUQueue.prototype.submit = function (...args) {
        const result = submit.apply(this, args);
        context.drawImage(canvas, 0, 0, 1, 1, 0, 0, 1, 1);
        pixel = Array.from(context.getImageData(0, 0, 1, 1).data);
        return result;
    };
    restoreSubmission = () => { GPUQueue.prototype.submit = submit; };
    app = mountRuneBrowser(canvas, instance, { backend: 'webgpu', resizeTo: host });
    await app.ready;
    await new Promise(requestAnimationFrame);
    const renderer = app.renderer;
    check(pixel?.every((v, i) => Math.abs(v - [10, 80, 142, 255][i]) <= 1), 'GPU pixel: ' + pixel);
    const struts = checkFontStruts(api);

    const start = performance.now();
    api.rune_probe_diagnostics();
    const diagnosticsMs = performance.now() - start;
    check(diagnosticsMs < 5000, 'Native attach delay blocked the browser for ' + diagnosticsMs + ' ms');
    check(lines.includes('diagnostics passed'), 'Swift diagnostic checks: ' + lines.join('\n'));

    // Rust seeds a UInt64 xorshift with the epoch nanoseconds. Its top 24 bits fit in Float exactly.
    let seed = wallNs | 1n;
    const samples = [];
    for (let i = 0; i < 4; i++) {
        seed = BigInt.asUintN(64, seed ^ (seed << 13n));
        seed ^= seed >> 7n;
        seed = BigInt.asUintN(64, seed ^ (seed << 17n));
        samples.push(Number(seed >> 40n));
    }
    api.rune_probe_knob_sequence();
    check(lines.includes('knobs ' + samples.join(',')), 'Seeded knob sequence: ' + lines.join('\n'));

    let tick = performance.now() + 100;
    Object.defineProperty(window, 'performance', { value: { now: () => (tick += 0.25) }, configurable: true });
    const elapsed = api.rune_probe_frame_ms();
    check(Math.abs(elapsed - 0.25) < 0.00001, 'Monotonic frame measurement: ' + elapsed);
    tick = 2 ** 64;
    const saturated = api.rune_probe_frame_ms();
    check(saturated === 0, 'Saturated clock tick: ' + saturated);
    result.textContent = 'PASS ' + JSON.stringify({ renderer, pixel, struts, samples, elapsed, saturated, diagnosticsMs, userAgent: navigator.userAgent });
} catch (error) {
    result.textContent = 'FAIL ' + error.message;
    throw error;
} finally {
    if (originalPerformance) Object.defineProperty(window, 'performance', originalPerformance);
    restoreSubmission?.();
    app?.dispose();
}
</script>
