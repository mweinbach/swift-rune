<!doctype html>
<meta charset="utf-8">
<title>Rune WebGL 2 production blur</title>
<canvas></canvas><pre id="result">Running…</pre>
<script type="module">
import { RuneWebGL, loadRuneShaders } from '../../Sources/Rune/Resources/Web/rune-webgl.mjs';

import { width, height, scene, nestedScene, sigmas, cases, draw } from './blur-scenes.mjs';

let driver;
const result = document.querySelector('#result');
try {
    driver = new RuneWebGL(document.querySelector('canvas'), await loadRuneShaders());
    const gl = driver.gl;
    const pixel = new Uint8Array(4);
    function check(probes, rgb) {
        for (const [i, [x, y]] of probes.entries()) {
            gl.readPixels(x, height - y - 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
            const expected = [...rgb.slice(3 * i, 3 * i + 3), 255];
            if (pixel.some((actual, c) => Math.abs(actual - expected[c]) > 2)) {
                throw new Error('Pixel ' + [x, y] + ' rendered ' + pixel + ', expected ' + expected);
            }
        }
        if (gl.getError() !== gl.NO_ERROR) throw new Error('WebGL reported an error');
    }
    for (const test of cases) {
        for (const [index, sigma] of sigmas.entries()) {
            draw(driver, scene(test.backdrop, sigma));
            check(test.probes, test.rgb[index]);
        }
    }
    // The parent extends beyond the window. Its rotated content and nested backdrop
    // must sample relative to their layer texture origins at the left window edge.
    const edgeProbes = [[0, 27], [1, 10], [8, 47], [31, 34]];
    draw(driver, nestedScene(0.37));
    check(edgeProbes, [49, 34, 36, 62, 24, 19, 55, 46, 50, 21, 96, 125]);
    draw(driver, nestedScene(-0.9));
    check(edgeProbes, [5, 10, 15, 5, 10, 15, 62, 24, 19, 34, 102, 129]);
    result.textContent = 'PASS ' + JSON.stringify(driver.info);
} catch (error) {
    result.textContent = 'FAIL ' + error.stack;
} finally {
    driver?.dispose();
}
</script>
