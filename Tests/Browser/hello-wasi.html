<!doctype html>
<meta charset="utf-8">
<title>Swift Rune WASI application</title>
<style>* { margin: 0 } #host { width: 320px; height: 200px } canvas { width: 100%; height: 100% }</style>
<div id="host"><canvas></canvas></div>
<pre id="result">Starting WASI…</pre>
<script type="module">
import { instantiateRuneBrowser, mountRuneBrowser } from '../../Sources/Rune/Resources/Web/rune-web.mjs';

const result = document.querySelector('#result');
const canvas = document.querySelector('canvas');
const host = document.querySelector('#host');
let app;
try {
    const { WASI, ConsoleStdout, OpenFile, File } = await import('/__rune/shim/index.js');
    const wasi = new WASI(['rune-hello'], [], [new OpenFile(new File([])),
        ConsoleStdout.lineBuffered(console.log), ConsoleStdout.lineBuffered(console.error)]);
    const { instance } = await instantiateRuneBrowser(fetch('/__rune/app.wasm'), { wasi_snapshot_preview1: wasi.wasiImport });
    wasi.initialize(instance);
    const api = instance.exports;
    const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: false, depth: false, stencil: false, antialias: false });
    if (!gl) throw Error('WebGL 2 is unavailable');
    let geometry, presented;
    const drawArrays = gl.drawArrays.bind(gl);
    gl.drawArrays = (...args) => {
        drawArrays(...args);
        if (!geometry || gl.getParameter(gl.FRAMEBUFFER_BINDING) !== null) return;
        const { sw, height } = geometry;
        const pixel = new Uint8Array(4);
        gl.readPixels(Math.floor(sw[0] + sw[2] * 0.22), height - 1 - Math.floor(sw[1] + sw[3] / 2),
            1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
        presented = { ...geometry, pixel: Array.from(pixel) };
    };
    app = mountRuneBrowser(canvas, { exports: {
        ...api,
        rune_web_frame() { throw Error('The browser invoked the CPU rasterizer'); },
        rune_web_scene(time, force) {
            const length = api.rune_web_scene(time, force);
            if (length <= 0) return length;
            const ptr = api.rune_web_buffer(0), h = new Uint32Array(api.memory.buffer, ptr, 14);
            if (h[0] !== 0x32475352) throw Error('Unexpected RenderFrame packet');
            const instances = new Float32Array(api.memory.buffer, ptr + 56, h[4] * 32);
            const scale = h[1] / host.getBoundingClientRect().width;
            const findRect = (w, h) => {
                for (let i = 0; i < instances.length; i += 32) {
                    if (instances[i + 17] === 0 && Math.abs(instances[i + 2] / scale - w) < 1 &&
                        Math.abs(instances[i + 3] / scale - h) < 1) return Array.from(instances.subarray(i, i + 4));
                }
            };
            const sw = findRect(38, 22), knob = findRect(18, 18);
            if (sw && knob) geometry = { sw, knob, scale, width: h[1], height: h[2], instances: h[4] };
            return length;
        }
    } });
    await app.ready;
    const initial = presented;
    if (!initial || initial.width !== 320 * devicePixelRatio || initial.height !== 200 * devicePixelRatio) {
        throw Error('Initial GPU viewport did not match the application and its device scale');
    }
    window.runeClick = { x: (initial.sw[0] + initial.sw[2] / 2) / initial.scale,
        y: (initial.sw[1] + initial.sw[3] / 2) / initial.scale };
    result.textContent = 'Click the Lights switch';
    async function until(predicate, message) {
        for (let i = 0; i < 600; ++i) {
            if (predicate()) return;
            await new Promise(requestAnimationFrame);
        }
        throw Error(message);
    }
    await until(() => presented.knob[0] - initial.knob[0] >= 14 * initial.scale &&
        presented.pixel.some((channel, i) => Math.abs(channel - initial.pixel[i]) > 12), 'Switch did not change on the GPU');
    const toggled = presented;
    host.style.width = '400px';
    host.style.height = '240px';
    await until(() => presented.width === 400 * initial.scale && presented.height === 240 * initial.scale &&
        presented.sw[0] > toggled.sw[0], 'Resize did not relayout the switch');
    window.runeRendered = { initial, toggled, resized: presented, renderer: app.renderer };
    result.textContent = 'PASS ' + JSON.stringify(window.runeRendered);
} catch (error) {
    app?.dispose();
    result.textContent = 'FAIL ' + error.stack;
}
</script>
