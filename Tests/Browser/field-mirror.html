<!doctype html>
<meta charset="utf-8">
<!-- Serve the repository root with python3 -m http.server, then open /Tests/Browser/field-mirror.html. -->
<title>Rune browser field mirror</title>
<canvas id="canvas" tabindex="0"></canvas>
<button id="outside">Outside Rune</button>
<pre id="result">Running…</pre>
<script type="module">
import { mountRuneBrowser, mountRuneFields } from "../../Sources/Rune/Resources/Web/rune-web.mjs";

const canvas = document.querySelector("#canvas");
const outside = document.querySelector("#outside");
const result = document.querySelector("#result");
const events = [];
const tick = () => new Promise(resolve => setTimeout(resolve, 0));
function expect(condition, message) {
    if (!condition) throw new Error(message);
}
function lastEvent(kind) {
    const event = events.findLast(event => event.kind === kind);
    expect(event, "Missing " + kind + " event");
    return event;
}

function expectKeyOrigin(target, key, nativeField) {
    events.length = 0;
    const event = new KeyboardEvent("keydown", { code: key, key, shiftKey: true, bubbles: true, cancelable: true });
    target.dispatchEvent(event);
    const sent = lastEvent("key");
    expect(events.length === 1 && sent.code === key && sent.key === key && sent.shift && event.defaultPrevented,
        "Handled keydown did not reach Rune with its key and modifiers");
    expect(nativeField ? sent.field === true : !("field" in sent), "Wrong key origin from " + target.tagName);
}

let fields;
let browser;
try {
    outside.focus();
    fields = mountRuneFields(canvas, event => events.push(event));
    const text = "opening line\n" + "中🦦 long line ".repeat(150) + "\nlast line";
    const start = text.indexOf("🦦");
    const mirror = { key: "draft", label: "Message", base: 117, text, anchor: start, focus: start, secure: false };
    fields.sync(mirror);
    expect(document.activeElement === outside, "Passive sync moved external focus");

    fields.sync(mirror, true);
    const editor = document.activeElement;
    expect(editor instanceof HTMLTextAreaElement, "Activation did not focus the native textarea");
    expect(editor.getAttribute("aria-label") === "Message", "Native textarea lost its authored accessible name");
    expect(editor.wrap === "off" && editor.value === text, "Native textarea did not preserve the hard lines");
    await tick();
    expectKeyOrigin(editor, "ArrowLeft", true);
    events.length = 0;
    editor.setSelectionRange(start, start + "🦦".length, "backward");
    await tick();
    const selection = lastEvent("selection");
    expect(selection.key === mirror.key && selection.base === mirror.base && selection.expected === text,
        "Selection used the wrong source window");
    expect(selection.anchor === start + 2 && selection.focus === start, "Backward emoji selection lost its UTF-16 direction");

    events.length = 0;
    expect(document.execCommand("insertText", false, "£"), "Browser declined the native insert");
    await tick();
    const edit = lastEvent("edit");
    const edited = text.slice(0, start) + "£" + text.slice(start + 2);
    expect(edit.expected === text && edit.text === edited && edit.key === mirror.key && edit.base === mirror.base,
        "Native edit did not replace the selected text in the correct window");
    expect(edit.anchor === start + 1 && edit.focus === start + 1, "Caret after native edit is wrong");

    outside.focus();
    fields.sync({ ...mirror, text: edited, anchor: edit.anchor, focus: edit.focus });
    expect(document.activeElement === outside, "A later passive frame stole external focus");
    fields.sync(null);
    expect(document.activeElement === outside, "Clearing the field stole external focus");

    const secure = { key: "password", base: 0, text: "", anchor: 0, focus: 0, secure: true };
    fields.sync(secure, true);
    const password = document.activeElement;
    expect(password instanceof HTMLInputElement && password.type === "password", "Secure activation did not focus the password input");
    expect(password.value === "", "Secure content persisted in the native password field");
    expectKeyOrigin(password, "Backspace", true);
    events.length = 0;
    const deletion = new InputEvent("beforeinput", { inputType: "deleteContentBackward", bubbles: true, cancelable: true });
    password.dispatchEvent(deletion);
    const deleteKey = lastEvent("key");
    expect(deleteKey.field === true && deleteKey.key === "Backspace" && deletion.defaultPrevented,
        "Password beforeinput deletion lost its native field origin");
    events.length = 0;
    expect(document.execCommand("insertText", false, "private"), "Browser declined password text input");
    await tick();
    const insert = lastEvent("insert");
    expect(insert.key === secure.key && insert.text === "private", "Secure insert did not reach its field");
    expect(password.value === "" && !events.some(event => event.kind === "edit"), "Secure content entered the ordinary mirror");

    fields.sync(null);
    expect(document.activeElement === canvas, "Clearing the active Rune field did not return focus to the canvas");
    fields.dispose();
    expect(!editor.isConnected && !password.isConnected, "Rune left native field nodes mounted after disposal");
    events.length = 0;
    editor.dispatchEvent(new InputEvent("input", { bubbles: true, data: "after teardown" }));
    await tick();
    expect(events.length === 0, "A disposed field still sent an event");

    // Capture the JSON the canvas event listener sends over the reactor's byte buffer.
    const memory = new WebAssembly.Memory({ initial: 1 });
    const decoder = new TextDecoder();
    browser = mountRuneBrowser(canvas, { exports: {
        memory, rune_web_enable() {}, __main_void: () => 0, rune_web_frame: () => 0,
        rune_web_field: () => 0, rune_web_buffer: () => 0,
        rune_web_event(length) {
            events.push(JSON.parse(decoder.decode(new Uint8Array(memory.buffer, 0, length))));
            return 1;
        }
    } });
    expectKeyOrigin(canvas, "ArrowLeft", false);
    browser.dispose();
    result.textContent = "PASS";
} catch (error) {
    browser?.dispose();
    fields?.dispose();
    result.textContent = "FAIL " + error.message;
    throw error;
}
</script>
