<!doctype html>
<meta charset="utf-8">
<title>Rune browser task, timer and display wakes</title>
<style>canvas { width:100%; height:100% } #host { width:96px; height:48px }</style>
<div id="host"><canvas></canvas></div>
<pre id="result">Starting…</pre>
<script type="module">
import { instantiateRuneBrowser, mountRuneBrowser } from '../../Sources/Rune/Resources/Web/rune-web.mjs';
import { WASI, ConsoleStdout, OpenFile, File } from '/__rune/shim/index.js';

const result = document.querySelector('#result');
const host = document.querySelector('#host'), canvas = host.querySelector('canvas');
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
function check(value, message) { if (!value) throw Error(message); }
let frameRequests = 0;
const nativeRAF = window.requestAnimationFrame;
window.requestAnimationFrame = callback => { frameRequests++; return nativeRAF.call(window, callback); };
let app;
try {
    const wasi = new WASI(['wake-probe'], [], [new OpenFile(new File([])),
        ConsoleStdout.lineBuffered(console.log), ConsoleStdout.lineBuffered(console.error)]);
    const { instance } = await instantiateRuneBrowser(fetch('/__rune/wake.wasm'), { wasi_snapshot_preview1: wasi.wasiImport }, {fontDirectory:null});
    wasi.initialize(instance);
    const api = instance.exports;
    check(typeof api.rune_web_next_wake === 'function', 'Missing deadline export');
    let calls = 0, painted = 0, color, width;
    const waits = [];
    const backend = new URL(location.href).searchParams.get('backend') ?? 'cpu';
    const entry = backend === 'cpu' ? 'rune_web_frame' : 'rune_web_scene';
    const sample = new OffscreenCanvas(1,1).getContext('2d', {willReadFrequently:true});
    app = mountRuneBrowser(canvas, { exports: { ...api,
        [entry](...args) { calls++; return api[entry](...args); },
        rune_web_accessibility() {
            // Read the last pixel from the presented canvas before the GPU releases this drawable.
            width = canvas.width;
            sample.drawImage(canvas, width-1, canvas.height-1, 1, 1, 0, 0, 1, 1);
            color = Array.from(sample.getImageData(0, 0, 1, 1).data.subarray(0,3));
            painted++;
            return api.rune_web_accessibility();
        }
    } }, { backend, resizeTo:host });
    await app.ready;
    async function until(predicate, label) {
        const end = performance.now() + 4000;
        while (!predicate() && performance.now() < end) await wait(5);
        check(predicate(), label + ' at ' + JSON.stringify({calls,painted,color,width}));
    }
    async function rest() {
        await wait(120);
        const count = calls;
        const requested = frameRequests;
        await wait(120);
        check(count === calls, 'Idle polling entered WASI ' + (calls - count) + ' times');
        check(requested === frameRequests, 'A resting app requested another animation frame');
    }
    function key(k) { canvas.dispatchEvent(new KeyboardEvent('keydown', {key:k, code:'Key'+k.toUpperCase()})); }
    await until(() => color && color[0] === 8, 'Initial frame');
    await rest();
    for (const [k, active, done] of [['t', [80,0,0], [0,90,0]], ['f', [0,0,120], [160,0,160]], ['h', [0,90,110], [80,100,0]]]) {
        const submitted = performance.now();
        key(k);
        const same = c => color && c.every((n,i) => Math.abs(color[i]-n) <= 1);
        await until(() => same(active), 'Wake input ' + k);
        const before = calls;
        const started = performance.now();
        await until(() => same(done), 'Timed work ' + k);
        check(performance.now() - submitted >= 245, 'Completed the 250 ms wait early for ' + k);
        check(calls - before <= 2, 'Polled while waiting for ' + k + ': ' + (calls - before) + ' calls');
        waits.push({key:k, elapsedMS:Math.round(performance.now() - started), calls:calls - before});
        await rest();
    }
    key('i');
    await until(() => color && color[0] === 64, 'Image decoder queued by a Swift task while idle');
    await rest();
    api.rune_probe_late_image();
    await until(() => color && color[0] === 120, 'Image decoder started directly from JavaScript while idle');
    await rest();
    host.style.width = '112px';
    await until(() => width === Math.round(112 * devicePixelRatio), 'ResizeObserver wake');
    await rest();
    const start = painted;
    key('a');
    await until(() => painted >= start + 4, 'Continuous animation');
    result.textContent = 'PASS ' + JSON.stringify({renderer:app.renderer.api, idleCalls:0, idleFrameRequests:0,
        waits, resizedWidth:width, animationFrames:painted-start});
} catch (error) {
    result.textContent = 'FAIL ' + error.message;
    throw error;
} finally { app?.dispose(); window.requestAnimationFrame = nativeRAF; }
</script>
