<!doctype html>
<meta charset="utf-8">
<pre id="result"></pre>
<script type="module">
import { createRuneTextImports, runeTextFontsReady } from '../../Sources/Rune/Resources/Web/rune-web-text.mjs';

const check = (condition, message) => { if (!condition) throw Error(message); };
try {
    const memory = new WebAssembly.Memory({ initial: 16 });
    const data = new DataView(memory.buffer);
    const bytes = new Uint8Array(memory.buffer);
    const utf8 = new TextEncoder();
    const host = createRuneTextImports(() => memory);
    for (const [navigator, kind] of [
        [{ userAgentData: { platform: 'macOS' } }, 1],
        [{ platform: 'MacIntel', maxTouchPoints: 5 }, 2],
        [{ platform: 'iPhone' }, 2],
        [{ userAgentData: { platform: 'Windows' }, platform: 'Linux' }, 3],
        [{ platform: 'Linux aarch64' }, 0],
    ]) {
        const bridge = createRuneTextImports(() => memory, { defaultView: { navigator } });
        check(bridge.platform() === kind, 'Wrong native text raster platform');
    }
    let pageFont;
    for (const file of ['Inter-Regular', 'IBMPlexMono-Regular']) {
        const font = new Uint8Array(await (await fetch('../../Sources/Rune/Resources/Fonts/' + file + '.ttf')).arrayBuffer());
        bytes.set(font, 0);
        check(host.font(0, font.length) === 1, 'App font registration failed');
        if (file === 'IBMPlexMono-Regular') {
            const existing = new FontFace('Rune Page Font', font);
            pageFont = await existing.load();
            document.fonts.add(pageFont);
        }
    }
    await runeTextFontsReady(memory);
    {
        const source = utf8.encode('office é'), settings = utf8.encode('liga=0');
        bytes.set(source, 512);
        bytes.set(utf8.encode('Inter'), 256);
        bytes.set(settings, 1024);
        function configuredMetrics(defer) {
            bytes.fill(0xa5, 0, 40);
            const id = host.create(512, source.length, 256, 5, 16, 400, 0, 0, 1, 0, 40, defer);
            try {
                check(id, 'Configured line failed to open');
                if (defer) check(bytes.subarray(0, 40).every(b => b === 0xa5), 'Measured the unconfigured font');
                host.configure(id, 0, 0, 1024, settings.length, 0, 0, 0, 40);
                return bytes.slice(0, 40);
            } finally {
                host.release(id);
            }
        }
        const original = configuredMetrics(0), deferred = configuredMetrics(1);
        check(original.every((b, i) => b === deferred[i]), 'Configured text metrics changed');
    }
    // A metrics-only line should be usable without forcing DOM layout. Range coordinates must
    // stay relative to the span when a later configuration changes its position.
    const boundsDescriptor = Object.getOwnPropertyDescriptor(HTMLSpanElement.prototype, 'getBoundingClientRect');
    const spanBounds = HTMLSpanElement.prototype.getBoundingClientRect;
    const createTextNode = Document.prototype.createTextNode;
    let reads = 0, textNodes = 0, measuredSpan, probe;
    Document.prototype.createTextNode = function (text) {
        ++textNodes;
        return createTextNode.call(this, text);
    };
    HTMLSpanElement.prototype.getBoundingClientRect = function () {
        reads++;
        measuredSpan = this;
        return spanBounds.call(this);
    };
    try {
        bytes.set(utf8.encode('Inter'), 256);
        bytes.set(utf8.encode('abc'), 512);
        probe = host.create(512, 3, 256, 5, 16, 400, 0, 0, 1, 0, 40);
        host.configure(probe, 0, 0, 0, 0, 0, 0, 0, 40);
        check(reads === 0, 'Measuring forced a span layout');
        check(textNodes === 0, 'A metrics-only browser line retained a DOM text node');
        const first = host.caret(probe, 1);
        host.caret(probe, 2);
        check(first > 0 && reads === 1, 'Caret queries did not share the span origin');
        check(!measuredSpan.checkVisibility({ opacityProperty: true, visibilityProperty: true }),
            'An internal text measurement span would paint over the app');
        measuredSpan.style.transform = 'translateX(31px)';
        host.configure(probe, 0, 0, 0, 0, 0, 0, 0, 40);
        check(reads === 1 && Math.abs(host.caret(probe, 1) - first) < 0.01 && reads === 2,
            'The reconfigured line reused a stale span origin');
    } finally {
        if (probe) host.release(probe);
        Document.prototype.createTextNode = createTextNode;
        if (boundsDescriptor) Object.defineProperty(HTMLSpanElement.prototype, 'getBoundingClientRect', boundsDescriptor);
        else delete HTMLSpanElement.prototype.getBoundingClientRect;
    }
    // On RTL pages, an unrelated wide line must not move a retained line's caret origin.
    {
        const direction = document.documentElement.dir;
        const handles = [];
        function retain(text) {
            const input = utf8.encode(text);
            bytes.set(input, 512);
            const id = host.create(512, input.length, 256, 5, 16, 400, 0, 0, 1, 0, 40);
            check(id, 'Could not retain text line');
            handles.push(id);
            return id;
        }
        try {
            document.documentElement.dir = 'rtl';
            bytes.set(utf8.encode('Inter'), 256);
            const first = retain('Test 123');
            host.caret(first, 0);
            for (let i = 0; i < 128; i++) retain('line ' + i);
            retain('A much wider line '.repeat(80));
            const expected = host.caret(retain('Test 123'), 3);
            check(host.caret(first, 3) === expected, 'Sibling measurement moved the retained caret');
            check(document.querySelectorAll('[inert][aria-hidden="true"] span').length < 32,
                'Retained lines accumulated in the document layout');
            for (const id of handles.splice(0)) host.release(id);
            check(host.caret(retain('Test 123'), 3) === expected, 'Reopening changed the caret position');
        } finally {
            for (const id of handles) host.release(id);
            document.documentElement.dir = direction;
        }
    }
    function shape(text, direction = 0, features = '', stack = 'Inter', reportSource = false) {
        const input = utf8.encode(text);
        const stackBytes = utf8.encode(stack);
        bytes.set(stackBytes, 256);
        bytes.set(input, 512);
        const id = host.create(512, input.length, 256, stackBytes.length, 36, 400, 0, 0, direction, 0, 40);
        check(id, 'No browser text engine');
        try {
            if (features) {
                const settings = utf8.encode(features);
                bytes.set(settings, 1024);
                host.configure(id, 0, 0, 1024, settings.length, 0, 0, 0, 40);
            }
            const advance = data.getFloat32(0, true);
            const x = data.getInt32(12, true), y = data.getInt32(16, true);
            const width = data.getInt32(20, true), height = data.getInt32(24, true);
            check(width > 0 && height > 0 && host.mask(id, x, y, width, height, 4096), 'No ink');
            const mask = bytes.slice(4096, 4096 + width * height);
            const ink = mask.filter(a => a > 0).length;
            let colorPixels = 0;
            if (host.has_color(id)) {
                check(host.color(id, x, y, width, height, 32768), 'Color readback');
                const rgba = bytes.subarray(32768, 32768 + width * height * 4);
                for (let i = 0; i < rgba.length; i += 4) {
                    if (rgba[i + 3] && rgba[i] !== rgba[i + 2]) ++colorPixels;
                }
            }
            check(colorPixels > 0 || mask.some(a => a > 0 && a < 255), 'Coverage lacks antialiasing');
            check(data.getFloat32(28, true) > data.getFloat32(36, true) && data.getFloat32(36, true) > 0, 'Face metrics missing');
            const cells = [];
            const records = 262144, stride = 28;
            let offset = 0;
            for (const { segment } of new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(text)) {
                const end = offset + utf8.encode(segment).length;
                const dir = host.cell(id, offset, end, 64, 68);
                const cell = { x: data.getFloat32(64, true), width: data.getFloat32(68, true), dir };
                if (reportSource) {
                    cell.source = host.cell(id, offset, end, 64, 68, true);
                    check(Math.sign(cell.source) === dir, 'Source reporting changed the cell direction for ' + segment);
                    check(data.getFloat32(64, true) === cell.x && data.getFloat32(68, true) === cell.width,
                        'Source reporting changed the cell geometry for ' + segment);
                }
                data.setInt32(records + cells.length * stride, offset, true);
                data.setInt32(records + cells.length * stride + 4, end, true);
                cells.push(cell);
                offset = end;
            }
            host.cells(id, records, cells.length, reportSource);
            for (let i = 0; i < cells.length; ++i) {
                const cell = cells[i], base = records + i * stride;
                const from = data.getInt32(base, true), to = data.getInt32(base + 4, true);
                check(data.getFloat32(base + 8, true) === cell.x && data.getFloat32(base + 12, true) === cell.width &&
                    data.getFloat32(base + 16, true) === Math.fround(host.caret(id, from)) &&
                    data.getFloat32(base + 20, true) === Math.fround(host.caret(id, to)) &&
                    data.getInt32(base + 24, true) === (reportSource ? cell.source : cell.dir),
                    'Bulk geometry differs from the individual native measurements at byte ' + from + ' in ' + text);
            }
            return { advance, cells, ink, mask, colorPixels, x, y, width, height, ascent: data.getFloat32(4, true) };
        } finally { host.release(id); }
    }
    // The normal cell ABI returns the direction. An opt-in result also identifies
    // text covered by a registered face without changing the selection geometry.
    {
        const sources = (text, stack = 'Inter', direction = 1) =>
            shape(text, direction, '', stack, true).cells.map(cell => cell.source);
        const mixed = sources('ffi漢ش🙂e\u0301🡐');
        check(mixed.map(Math.abs).join() === '2,2,2,1,1,1,1,2', 'Mixed registered and platform cells: ' + mixed);
        // Inter uses cmap format 12 for U+1F850. Plex Mono uses format 4
        // for Latin and Cyrillic and has no glyph for Greek capital omega.
        check(sources('XЖΩ', 'IBM Plex Mono').map(Math.abs).join() === '2,2,1', 'Plex Mono Latin/Cyrillic/Greek');
        check(sources('Ω', 'IBM Plex Mono, Inter')[0] === 2, 'Lost fallback to a second registered face');
        for (const stack of ['serif, Inter', 'Rune Page Font, Inter']) {
            check(sources('A', stack)[0] === 1, 'Claimed a generic or page-registered face in ' + stack);
        }
        check(sources('אבג', 'Inter', 2).every(value => value === -1), 'RTL fallback lost its signed direction');
        const foreign = await new FontFace('Inter', 'url(../../Sources/Rune/Resources/Fonts/IBMPlexMono-Regular.ttf)').load();
        bytes.set(utf8.encode('Inter'), 256);
        bytes.set(utf8.encode('A'), 512);
        const retained = host.create(512, 1, 256, 5, 16, 400, 0, 0, 1, 0, 40);
        try {
            check(host.cell(retained, 0, 1, 64, 68, true) === 2, 'Registered Inter lost its source');
            const count = document.fonts.size;
            document.fonts.delete(pageFont);
            document.fonts.add(foreign);
            check(document.fonts.size === count, 'Fixture failed to replace exactly one page face');
            host.configure(retained, 0, 0, 0, 0, 0, 0, 0, 40);
            check(host.cell(retained, 0, 1, 64, 68, true) === 1, 'Reconfigured run retained a competing face');
        } finally {
            host.release(retained);
            document.fonts.delete(foreign);
            document.fonts.add(pageFont);
        }
    }
    // An embedding page may style all spans. Rune still owns an explicit line direction.
    const directionRule = document.createElement('style');
    document.head.append(directionRule);
    try {
        const sample = '12 / אבג A ?';
        const cells = direction => JSON.stringify(shape(sample, direction).cells);
        const ltr = cells(1), rtl = cells(2);
        check(ltr !== rtl, 'Fixture needs distinct LTR and RTL geometry');
        directionRule.textContent = 'span { direction: rtl !important }';
        check(cells(1) === ltr, 'Page CSS changed explicit LTR geometry');
        directionRule.textContent = 'span { direction: ltr !important }';
        check(cells(2) === rtl, 'Page CSS changed explicit RTL geometry');
    } finally { directionRule.remove(); }
    // A retained run can change paint or selection colors without reshaping. In
    // particular, macOS smooths dark and light glyphs differently on a clear canvas.
    {
        const sample = 'file8829.rs', family = 'Inter', width = 160, height = 24;
        bytes.set(utf8.encode(sample), 512);
        bytes.set(utf8.encode(family), 256);
        const id = host.create(512, sample.length, 256, family.length, 14, 400, 0, 0, 1, 0, 40);
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const reference = canvas.getContext('2d', { willReadFrequently: true });
        reference.font = '400 14px Inter';
        try {
            for (const rgb of [0xffffff, 0, 0x2776bc, 0x333333, 0xffffff]) {
                check(host.mask(id, 0, 0, width, height, 4096, rgb), 'Missing foreground tile');
                reference.clearRect(0, 0, width, height);
                reference.fillStyle = '#' + rgb.toString(16).padStart(6, '0');
                reference.fillText(sample, 0, data.getFloat32(4, true));
                const pixels = reference.getImageData(0, 0, width, height).data;
                check(bytes.subarray(4096, 4096 + width * height).every((alpha, i) => alpha === pixels[4 * i + 3]),
                    'Retained coverage differed from the native foreground ' + reference.fillStyle);
            }
            // Adjacent atlas cells reuse the scratch bitmap at different offsets
            // and sizes. Include a blank tile after a larger ownership probe.
            for (const [x, w, h] of [[5, 13, 21], [0, 275, 132], [200, 11, 18], [-9, 73, 22], [0, width, height]]) {
                check(host.mask(id, x, 0, w, h, 4096), 'Missing cropped tile');
                canvas.width = w;
                canvas.height = h;
                reference.font = '400 14px Inter';
                reference.fillStyle = '#fff';
                reference.fillText(sample, -x, data.getFloat32(4, true));
                const pixels = reference.getImageData(0, 0, w, h).data;
                check(bytes.subarray(4096, 4096 + w * h).every((alpha, i) => alpha === pixels[4 * i + 3]),
                    'Resizing the scratch surface changed cropped coverage');
            }
        } finally { host.release(id); }
        const mixedText = 'A 😀', input = utf8.encode(mixedText);
        bytes.set(input, 512);
        const mixed = host.create(512, input.length, 256, family.length, 14, 400, 0, 0, 1, 0, 40);
        try {
            const textEnd = Math.floor(reference.measureText('A ').width);
            const maskPtr = 4096, colorPtr = 16384;
            for (const rgb of [0, 0xa04d9c, 0xffffff]) {
                check(host.mask(mixed, 0, 0, width, height, maskPtr, rgb) &&
                    host.color(mixed, 0, 0, width, height, colorPtr), 'Missing mixed paint planes');
                reference.clearRect(0, 0, width, height);
                reference.fillStyle = '#' + rgb.toString(16).padStart(6, '0');
                reference.fillText(mixedText, 0, data.getFloat32(4, true));
                const pixels = reference.getImageData(0, 0, width, height).data;
                for (let i = 0; i < width * height; i++) {
                    if (i % width < textEnd) {
                        check(bytes[maskPtr + i] === pixels[4 * i + 3] && !bytes[colorPtr + 4 * i + 3],
                            'Mixed run lost tintable foreground coverage');
                    } else {
                        check(!bytes[maskPtr + i] && [0, 1, 2, 3].every(c => bytes[colorPtr + 4 * i + c] === pixels[4 * i + c]),
                            'Tinted an intrinsic emoji color');
                    }
                }
            }
        } finally { host.release(mixed); }
    }
    const han = shape('漢'), day = shape('日');
    check(han.ink !== day.ink && han.ink > 40 && day.ink > 40, 'CJK fallback collapsed to a replacement box');
    const latin = shape('é'), combining = shape('e\u0301');
    check(combining.cells.length === 1 && latin.mask.join() === combining.mask.join(), 'Combining mark separated');
    const mixed = shape('A אבג B');
    const hebrew = mixed.cells.slice(2, 5);
    check(hebrew.every(c => c.dir < 0) && hebrew[0].x > hebrew[1].x && hebrew[1].x > hebrew[2].x, 'RTL order failed');
    const arabic = shape('سلام', 2);
    check(arabic.cells[0].x > arabic.cells[3].x && arabic.ink > 70, 'Arabic shaping failed');
    check(shape('A\0日').cells.at(-1).width > 10, 'An internal NUL truncated the line');
    const kern = shape('AV').advance;
    check(kern < shape('A').advance + shape('V').advance, 'Kerning lost');
    const canvasCount = document.querySelectorAll('canvas').length;
    const unkerned = shape('AV', 0, 'kern=0.0');
    check(unkerned.advance > kern, 'Authored OpenType settings were lost');
    // Two separate glyph draws provide the native no-pair-adjustment reference.
    const context = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
    context.canvas.width = unkerned.width;
    context.canvas.height = unkerned.height;
    context.font = '400 36px Inter';
    context.fillStyle = 'white';
    const left = -unkerned.x, baseline = unkerned.ascent - unkerned.y;
    context.fillText('A', left, baseline);
    context.fillText('V', left + context.measureText('A').width, baseline);
    const reference = context.getImageData(0, 0, unkerned.width, unkerned.height).data;
    check(unkerned.mask.every((alpha, i) => alpha === reference[4 * i + 3]), 'Unkerned ink does not match separate glyphs');
    const withSystem = shape('AV', 0, 'kern=0.0', 'serif');
    const systemPair = shape('A', 0, '', 'serif').advance + shape('V', 0, '', 'serif').advance;
    check(Math.abs(withSystem.advance - systemPair) < 0.02, 'Installed face lost the unkerned pair');
    check(document.querySelectorAll('canvas').length === canvasCount, 'A released text run left a raster canvas attached');
    // A generic or installed family before an authored font must stay first even
    // when OpenType settings cause us to create a private alias for that font.
    const stacked = (stack, features = '') => shape('0AV', 0, features, stack).mask.join();
    check(stacked('"Missing, Face", iNTeR, monospace') === stacked('Inter'), 'Registered stack fallback');
    check(stacked('Missing, IBM Plex Mono, Inter') === stacked('"IBM Plex Mono"'), 'Multi-word stack fallback');
    check(stacked('Inter','zero=1') !== stacked('Inter'), 'Fixture face lacks the slashed-zero alternate');
    check(stacked('Missing, Inter', 'zero=1') === stacked('Inter', 'zero=1'), 'Fallback lost its feature alias');
    check(stacked('monospace, Inter', 'zero=1') === stacked('monospace'), 'Feature alias displaced generic monospace');
    check(stacked('Rune Page Font, Inter', 'zero=1') === stacked('Rune Page Font'), 'Feature alias displaced an existing browser face');
    const emoji = shape('😀');
    check(emoji.colorPixels > 40 && emoji.ink === 0, 'Intrinsic emoji color leaked into the tintable mask');
    const paragraph = 'Rune אבג 日本語 e\u0301 '.repeat(125);
    const encoded = utf8.encode(paragraph);
    const family = utf8.encode('Inter');
    bytes.set(family, 256);
    bytes.set(encoded, 512);
    const long = host.create(512, encoded.length, 256, family.length, 16, 400, 0, 0, 0, 0, 40);
    try {
        const end = host.caret(long, encoded.length);
        check(end > 12000 && Math.abs(end - data.getFloat32(0, true)) < 5, 'Long mixed-direction line geometry');
    } finally { host.release(long); }
    document.querySelector('#result').textContent = JSON.stringify({ passed: true, cjkInk: [han.ink, day.ink],
        combiningInk: combining.ink, arabicInk: arabic.ink, hebrewVisualPositions: hebrew.map(c => c.x),
        colorEmojiPixels: emoji.colorPixels, kernedAdvance: kern });
} catch (error) {
    document.querySelector('#result').textContent = 'FAIL ' + error.message + '\n' + (error.stack ?? '');
}
</script>
